- name: 4. Setup Reverse Proxy Nginx
  hosts: all
  become: yes
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        update_cache: yes

    - name: Reverse Proxy Config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/frontend.conf
      notify: Restart Nginx

    - name: Acative Nginx Site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/frontend.conf
        dest: /etc/nginx/sites-enabled/frontend.conf
        state: link

    - name: Remove default Nginx
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
